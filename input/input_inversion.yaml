# FWI inversion configuration — matched to inp_GPRmodel.m / inp_GPRmodel1.m
# 200x200 grid (180 interior + 10-cell CFS-PML on each side), dh=0.05m
forward:
  domain:
    nx: 200
    nz: 200
    dx: 0.05
    dz: 0.05
  pml:
    npx: 10
    npz: 10
    a0_cfs: 9.0e8
  freq_hz: 50e6
  freq_sweep:
    fc_low:  50e6
    fc_high: 200e6
    nf:      50
    clip:    2.5e-3
    clip1:   1.0e-2
    tmax_td: 150e-9

# 4-sided acquisition geometry (MATLAB: nrec=40/side, nsrc=20/side)
# Boundary: iz/ix = 20..179  (10 cells inside interior from each edge)
# Total: 82 sources (21+21+20+20), 162 receivers (41+41+40+40)
acquisition:
  mode: 4sided
  npml: 10
  nrec_per_side: 40
  nsrc_per_side: 20

# Initial model — homogeneous background (MATLAB: epsr=4.0, sig0=5.6e-3 for normalisation)
# Use true background values as starting point
initial_model:
  type: homogeneous
  epsr: 4.0
  sigma: 3.0e-3

# Inversion parameters (MATLAB: LBFGS, Wolfe line search)
inversion:
  max_iter: 50
  patience: 8           # early-stop window: N consecutive non-decreasing iters (after warmup)
  warmup_iters: 5       # skip first N iterations before applying early-stop check
  step_type: linesearch
  step_init: 1.0           # fallback if step_init_epsr/sigma not set
  step_init_epsr: 0.5      # max Δεᵣ per iter (7% of εᵣ range ≈ 7.0)
  step_init_sigma: 5.0e-4  # max Δσ per iter (2.5% of σ range ≈ 0.02 S/m)
  stepmax: 12           # max Armijo line-search trials (covers 2^12 step range)
  scale_fac: 2.0        # step halving factor (MATLAB SCALEFAC)
  c1_wolfe: 1.0e-4      # Armijo C1 sufficient-decrease constant
  conv_ratio: 1.0e-2    # stop if L2/L2[0] <= conv_ratio (1% of initial L2)
  sigma0: 5.6e-3        # conductivity normalisation reference (MATLAB sig0)
  regularization:
    type: tikhonov
    lambda_sigma: 2.0e-4  # Tikhonov weight for sigma (MATLAB LAMBDA_1=2e-4)
    lambda_epsr: 0.0       # Tikhonov weight for epsr (MATLAB LAMBDA_2=0)
    beta_sigma: 1.0
    beta_epsr: 1.0
    alpha: 1.0e-4          # kept for backward compat (= lambda_sigma fallback)
  bounds:
    epsr_min:  0.5      # covers dry-sand cross1 (true epsr=1.0)
    epsr_max:  10.0     # covers clay cross2 (true epsr=8.0) with margin
    sigma_min: 0.05e-3  # below dry-sand sigma=0.1e-3
    sigma_max: 15.0e-3  # above clay sigma=10e-3

# Data
data:
  observed_dir: obs
  synthetic_dir: results/forward

output:
  dir: results/inverse
  save_every_iter: true
